services:
  redis:
    image: redis:7-alpine
    profiles: ["local-infra"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/ai_mail_agent}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC:-postgresql://postgres:postgres@host.docker.internal:5432/ai_mail_agent}
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
    depends_on:
      redis:
        condition: service_started
        required: false

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A backend.scheduler.worker worker --loglevel=info
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/ai_mail_agent}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC:-postgresql://postgres:postgres@host.docker.internal:5432/ai_mail_agent}
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
    depends_on:
      redis:
        condition: service_started
        required: false

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A backend.scheduler.worker beat --loglevel=info
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/ai_mail_agent}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC:-postgresql://postgres:postgres@host.docker.internal:5432/ai_mail_agent}
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
    depends_on:
      redis:
        condition: service_started
        required: false

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL:-http://localhost:8000}
    depends_on:
      - backend
